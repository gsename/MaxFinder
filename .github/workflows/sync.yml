name: Synchronisation et alertes

# Le dataset SNCF est republie une fois par matin, mais pas toujours a heure
# fixe. On verifie donc quatre fois par jour : chaque run commence par une
# requete de metadonnees minuscule et ne telecharge quoi que ce soit que si le
# champ `modified` a change.
on:
  schedule:
    - cron: '20 5,9,13,17 * * *' # UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Reconstruire meme si le dataset est inchange'
        type: boolean
        default: false
      notify_test:
        description: 'Envoyer seulement une notification de test'
        type: boolean
        default: false
  push:
    branches: [main]
    # Sans cette exclusion, le commit d etat de ce workflow le redeclencherait.
    paths-ignore:
      - 'state/**'
      - '**/*.md'
      - '.gitignore'

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write # commit du fichier d etat
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Synchronisation, evaluation des alertes, notifications
        id: sync
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ "${{ inputs.notify_test }}" = "true" ]; then
            npx tsx scripts/sync.ts --notify-test
            exit 0
          fi
          # Un push de code doit redeployer le site meme si les donnees n ont
          # pas bouge, sinon la modification resterait invisible en ligne.
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            FORCE="--force"
          fi
          npx tsx scripts/sync.ts $FORCE

      # Persiste l etat AVANT le deploiement, et non apres : les notifications
      # viennent de partir, et si une etape ulterieure echoue (Pages mal
      # configure, par exemple) GitHub saute les etapes suivantes. L etat ne
      # serait alors jamais enregistre et chaque run reenverrait les memes
      # alertes indefiniment.
      #
      # Ce commit quotidien tient aussi lieu d activite sur le depot, ce qui
      # repousse la desactivation automatique des workflows planifies au bout
      # de 60 jours.
      - name: Commit de l etat des alertes
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/
          if git diff --cached --quiet; then
            echo 'Etat inchange, rien a committer.'
            exit 0
          fi
          git commit -m 'chore(state): synchronisation TGVmax [skip ci]'
          # Une autre execution peut avoir pousse entre-temps.
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push

      # Rejoue le test de rendu, cette fois sur les donnees fraichement
      # telechargees : en CI de PR il s ignore, faute de fichiers a lire.
      - name: Test de rendu sur les donnees reelles
        if: steps.sync.outputs.changed == 'true'
        run: npx vitest run src/App.test.tsx

      - name: Build du site
        if: steps.sync.outputs.changed == 'true'
        env:
          # Un site de projet est servi depuis /<repo>/ : sans ce prefixe, tous
          # les assets renvoient 404.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_REPO: ${{ github.repository }}
          VITE_BRANCH: ${{ github.ref_name }}
        run: npm run build

      - name: Configuration de Pages
        if: steps.sync.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Envoi de l artefact
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploiement
        id: deploy
        if: steps.sync.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
